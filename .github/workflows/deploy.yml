
name: Deploy Joltix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Joltix Part 1
        shell: bash
        run: |
          set -e

          mkdir -p site

          if [ ! -f joltix-part1.zip ]; then
            echo "ERROR: joltix-part1.zip not found in repository root."
            exit 1
          fi

          unzip -oq joltix-part1.zip -d site

          if [ ! -f site/index.html ]; then
            echo "ERROR: Homepage index.html is missing."
            find site -maxdepth 3 -type f | head -50
            exit 1
          fi

          touch site/.nojekyll

          echo "Joltix Part 1 extracted successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Joltix
        id: deployment
        uses: actions/deploy-pages@v4
