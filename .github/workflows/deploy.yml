
name: Deploy Joltix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Joltix Part 1
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p site

          if [ ! -f joltix-part1.zip ]; then
            echo "ERROR: ZIP file not found!"
            ls -la
            exit 1
          fi

          unzip -oq joltix-part1.zip -d site

          if [ ! -f site/index.html ]; then
            echo "ERROR: index.html not found!"
            find site -maxdepth 3 -type f | head -50
            exit 1
          fi

          touch site/.nojekyll

          echo "Website files:"
          ls -lah site | head -30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site

      - name: Deploy Joltix
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          
